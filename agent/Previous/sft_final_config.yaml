### 模型配置
model_name_or_path: /workspace/Processing/models/Qwen2.5-7B-Instruct
trust_remote_code: true
quantization_bit: 4
use_unsloth: true             # [核心] 必须开启

### 方法配置
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### 数据配置
#!!! 核心：指向刚刚注册的 final 数据集 !!!
dataset: stablejudge_sft_final
#!!! 核心：指向 dataset_info.json 所在的文件夹 !!!
dataset_dir: /workspace/Processing/agent
template: qwen
cutoff_len: 12288
#设为 10000 确保读完所有 4189 条数据
max_samples: 10000
packing: false
overwrite_cache: true
preprocessing_num_workers: 4

### 输出配置
#训练结果将保存在这里
output_dir: /workspace/Processing/models/qwen2.5_agent_sft_final_lora
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### 训练超参数
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: auto

### 评估配置
gradient_checkpointing: true
val_size: 0.05
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100